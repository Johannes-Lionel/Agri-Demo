<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Forest Green -->
    <radialGradient id="forestBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A472A" />
      <stop offset="100%" stop-color="#143A22" />
    </radialGradient>
    <!-- Center Leaf Gradient (Left side dark fold) -->
    <linearGradient id="centerLeafDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#184D26" />
      <stop offset="100%" stop-color="#1F5D2E" />
    </linearGradient>
    <!-- Center Leaf Gradient (Right side bright leaf) -->
    <linearGradient id="centerLeafLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55A338" />
      <stop offset="100%" stop-color="#3B8529" />
    </linearGradient>
    <!-- Side Leaves Gradient -->
    <linearGradient id="sideLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#469230" />
      <stop offset="100%" stop-color="#2D7224" />
    </linearGradient>
  </defs>

  <!-- Dark Green Canvas Background -->
  <rect width="500" height="500" fill="url(#forestBg)" rx="48" />

  <!-- Center Warm Cream Disc -->
  <circle cx="250" cy="250" r="195" fill="#F4EBDC" />

  <!-- Outer Fine Circle Rim around Leaves inside Disc -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#F4EBDC" stroke-width="4" />

  <!-- Three Leaves Group -->
  <!-- Left Leaf -->
  <path d="M 68 200 C 60 270 120 370 236 415 C 238 350 215 275 110 220 Z" 
        fill="url(#sideLeafGrad)" />

  <!-- Right Leaf -->
  <path d="M 432 200 C 440 270 380 370 264 415 C 262 350 285 275 390 220 Z" 
        fill="url(#sideLeafGrad)" />

  <!-- Center Leaf (Two-tone folded leaf) -->
  <!-- Left Dark Fold -->
  <path d="M 248 310 C 230 270 195 220 220 160 C 240 120 280 80 340 60 C 310 120 290 190 250 310 Z" 
        fill="url(#centerLeafDark)" />
  <!-- Right Bright Leaf Body -->
  <path d="M 340 60 C 365 110 350 200 275 260 C 248 282 248 310 248 310 C 290 190 310 120 340 60 Z" 
        fill="url(#centerLeafLight)" />
  <!-- Center Leaf Tip Polish -->
  <path d="M 340 60 C 320 85 260 135 240 190 C 230 220 235 250 248 310 C 275 250 330 190 340 60 Z" 
        fill="#3F892B" opacity="0.9" />

  <!-- Elegant Negative Space Stem Separation (Cream) -->
  <path d="M 236 415 Q 248 360 248 310 Q 252 360 264 415 Z" fill="#F4EBDC" />
</svg>
